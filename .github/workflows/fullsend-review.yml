name: Fullsend Manual PR Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: number

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch PR details
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          gh pr checkout $PR_NUMBER
          echo "pr_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Install Fullsend
        run: |
          curl -fsSL https://fullsend.sh/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Fullsend review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fullsend run review \
            --fullsend-dir .fullsend \
            --target-repo . \
            --forge github \
            --runtime codex \
            --model openai/gpt-5.6-luna

      - name: Post review comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          # Fullsend posts directly via GitHub API in post_script
          # This job completes after triage finishes
          echo "Review complete on PR #$PR_NUMBER"
