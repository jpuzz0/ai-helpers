name: Fullsend Manual PR Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: number

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch PR details
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          gh pr checkout $PR_NUMBER

      - name: Set up Fullsend
        run: |
          mkdir -p ~/fullsend-bin
          cd ~/fullsend-bin
          curl -fsSL -L https://github.com/fullsend-ai/fullsend/releases/download/v0.43.0/fullsend_0.43.0_linux_amd64.tar.gz | tar xz
          echo "$PWD" >> $GITHUB_PATH

      - name: Run Fullsend review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          GITHUB_PR_URL: https://github.com/${{ github.repository }}/pull/${{ github.event.inputs.pr_number }}
          PRIOR_REVIEW_SHA: ""
          PRIOR_REVIEW_PROVENANCE: ""
          # Stub GCP credentials to satisfy Fullsend validation.
          # Codex runtime uses OpenAI only; this variable is not read.
          GOOGLE_APPLICATION_CREDENTIALS: /dev/null
        run: |
          fullsend run review \
            --fullsend-dir .fullsend \
            --target-repo . \
            --forge github \
            --runtime codex \
            --model openai/gpt-5.6-luna
